plugins {
	id 'java'
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net' }
    }
}

tasks.register("client") {
    group = "run"
    dependsOn(":nami-client:runClient")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
